<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./html/css/index-style.css">
  </head>
  <body>
    <div class="page">
      <section class="band hero">
        <div class="profile-row">
          <div id="avatar" class="avatar">L</div>
          <div class="profile-copy">
            <div class="eyebrow">LINEプロフィール</div>
            <div id="profile-name" class="name">ログイン待ちです</div>
          </div>
          <div class="target-cluster">
            <div class="target-label">目標カロリー</div>
            <div class="target-input-wrap">
              <input id="calorie-target" type="number" min="0" step="1" inputmode="numeric">
              <span>kcal</span>
            </div>
            <button id="save-target" type="button" class="target-save">更新</button>
          </div>
        </div>
        <div id="status" class="status">LIFFを初期化しています。</div>
      </section>

      <section class="band">
        <div class="section-head">
          <div>
            <h2>食事を補完する</h2>
            <div class="section-copy">未登録メニューはここで数値を入れて、そのまま今日の集計に反映します。</div>
          </div>
        </div>

        <form id="meal-detail-form">
          <input id="user-id" type="hidden">
          <input id="display-name" type="hidden">
          <input id="master-key" type="hidden">
          <input id="meal-type" type="hidden" value="朝">

          <div class="meal-type-grid" id="meal-type-grid">
            <button type="button" class="meal-type-btn is-active" data-meal-type="朝">朝</button>
            <button type="button" class="meal-type-btn" data-meal-type="昼">昼</button>
            <button type="button" class="meal-type-btn" data-meal-type="夜">夜</button>
            <button type="button" class="meal-type-btn" data-meal-type="その他">その他</button>
          </div>

          <div class="fields">
            <label class="field" data-label="メニュー名">
              <span class="field-label">メニュー名</span>
              <input id="menu-name" data-field-label="メニュー名" autocomplete="off">
            </label>

            <div id="suggestion-box" class="notice suggestion" hidden></div>
            <div id="empty-box" class="notice warning" hidden>近い候補がまだありません。数値を入れて保存すると、次回から候補として使えます。</div>

            <div class="field-row">
              <label class="field" data-label="カロリー(kcal)">
                <span class="field-label">カロリー(kcal)</span>
                <input id="field-kcal" data-field-label="カロリー(kcal)" type="number" min="0" step="0.1" inputmode="decimal" required>
              </label>
              <label class="field" data-label="たんぱく質(g)">
                <span class="field-label">たんぱく質(g)</span>
                <input id="field-protein" data-field-label="たんぱく質(g)" type="number" min="0" step="0.1" inputmode="decimal">
              </label>
            </div>

            <div class="field-row">
              <label class="field" data-label="脂質(g)">
                <span class="field-label">脂質(g)</span>
                <input id="field-fat" data-field-label="脂質(g)" type="number" min="0" step="0.1" inputmode="decimal">
              </label>
              <label class="field" data-label="炭水化物(g)">
                <span class="field-label">炭水化物(g)</span>
                <input id="field-carb" data-field-label="炭水化物(g)" type="number" min="0" step="0.1" inputmode="decimal">
              </label>
            </div>

            <div class="field-row">
              <label class="field" data-label="塩分(g)">
                <span class="field-label">塩分(g)</span>
                <input id="field-salt" data-field-label="塩分(g)" type="number" min="0" step="0.1" inputmode="decimal">
              </label>
              <label class="field" data-label="食物繊維(g)">
                <span class="field-label">食物繊維(g)</span>
                <input id="field-fiber" data-field-label="食物繊維(g)" type="number" min="0" step="0.1" inputmode="decimal">
              </label>
            </div>

            <label class="field" data-label="単位">
              <span class="field-label">単位</span>
              <input id="field-unit" data-field-label="単位" autocomplete="off">
            </label>

            <label class="field" data-label="メモ">
              <span class="field-label">メモ</span>
              <textarea id="field-note" data-field-label="メモ"></textarea>
            </label>
          </div>

          <div class="actions">
            <button type="submit" class="primary">保存して記録</button>
            <button type="button" id="refresh-draft" class="secondary">候補を更新</button>
          </div>
        </form>

        <div id="meal-reply" class="reply"></div>
      </section>

      <section class="band">
        <div class="section-head">
          <div>
            <h2>近い候補</h2>
            <div class="section-copy">近いメニューの数値をそのままフォームに入れられます。</div>
          </div>
        </div>
        <div id="candidate-list" class="candidate-list"></div>
      </section>

      <section class="band">
        <div class="section-head">
          <div>
            <h2>今日の集計</h2>
            <div class="section-copy">LINEに返す内容と同じ集計をここでも確認できます。</div>
          </div>
        </div>
        <div class="cards">
          <div class="card">
            <div class="label">確定カロリー</div>
            <div id="card-exact" class="value">0</div>
          </div>
          <div class="card">
            <div class="label">推定カロリー</div>
            <div id="card-estimated" class="value">0</div>
          </div>
          <div class="card">
            <div class="label">目標差分</div>
            <div id="card-diff" class="value">-</div>
          </div>
          <div class="card">
            <div class="label">未登録件数</div>
            <div id="card-pending" class="value">0</div>
          </div>
        </div>
        <div id="nutrition-summary" class="summary-note"></div>
      </section>

      <section class="band">
        <div class="section-head">
          <div>
            <h2>今日のログ</h2>
            <div class="section-copy">当日の入力内容だけを時系列で表示します。</div>
          </div>
          <button type="button" id="close-liff" class="secondary">閉じる</button>
        </div>
        <div id="logs-list" class="log-list"></div>
      </section>
    </div>

    <script src="./html/js/site-config.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="./html/js/index-script.js"></script>
  </body>
</html>
